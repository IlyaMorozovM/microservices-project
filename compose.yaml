services:

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    environment:
      SERVER_PORT: ${EUREKA_SERVER_PORT}
    ports:
      - "${EUREKA_SERVER_PORT}:${EUREKA_SERVER_PORT}"

  resource-db:
    image: postgres:16-alpine
    container_name: resource-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d

  song-db:
    image: postgres:16-alpine
    container_name: song-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d

  resource-service:
    build:
      context: .
      dockerfile: resource-service/Dockerfile
    container_name: resource-service
    restart: unless-stopped
    depends_on:
      - resource-db
      - eureka-server
      - localstack
      - rabbitmq
    environment:
      SERVER_PORT: ${RESOURCE_SERVICE_PORT}
      SPRING_DATASOURCE_URL: ${RESOURCE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${RESOURCE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${RESOURCE_DB_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RESOURCE_PROCESSING_EXCHANGE: ${RESOURCE_PROCESSING_EXCHANGE}
      RESOURCE_PROCESSING_QUEUE: ${RESOURCE_PROCESSING_QUEUE}
      RESOURCE_PROCESSING_ROUTING_KEY: ${RESOURCE_PROCESSING_ROUTING_KEY}
    ports:
      - "${RESOURCE_SERVICE_PORT}:${RESOURCE_SERVICE_PORT}"

  song-service:
    build:
      context: .
      dockerfile: song-service/Dockerfile
    restart: unless-stopped
    depends_on:
      - song-db
      - eureka-server
    environment:
      SERVER_PORT: ${SONG_SERVICE_PORT}
      SPRING_DATASOURCE_URL: ${SONG_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SONG_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SONG_DB_PASSWORD}
      EUREKA_URL: ${EUREKA_URL}
    ports:
      - "${SONG_SERVICE_PORT}"

  resource-processor:
    build:
      context: .
      dockerfile: resource-processor/Dockerfile
    container_name: resource-processor
    restart: unless-stopped
    depends_on:
      - eureka-server
      - rabbitmq
    environment:
      SERVER_PORT: ${RESOURCE_PROCESSOR_PORT}
      EUREKA_URL: ${EUREKA_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RESOURCE_PROCESSING_EXCHANGE: ${RESOURCE_PROCESSING_EXCHANGE}
      RESOURCE_PROCESSING_QUEUE: ${RESOURCE_PROCESSING_QUEUE}
      RESOURCE_PROCESSING_ROUTING_KEY: ${RESOURCE_PROCESSING_ROUTING_KEY}
    ports:
      - "${RESOURCE_PROCESSOR_PORT}:${RESOURCE_PROCESSOR_PORT}"

  localstack:
    image: localstack/localstack:3.8
    container_name: localstack
    restart: unless-stopped
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./init-scripts/localstack:/etc/localstack/init/ready.d

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"