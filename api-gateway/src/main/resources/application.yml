server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: resource-service
          uri: lb://resource-service
          predicates:
            - Path=/api/resources, /api/resources/**
          filters:
            - RewritePath=/api/resources(?<segment>/?.*), /resources${segment}

        - id: song-service
          uri: lb://song-service
          predicates:
            - Path=/api/songs, /api/songs/**
          filters:
            - RewritePath=/api/songs(?<segment>/?.*), /songs${segment}

        - id: storage-service
          uri: lb://storage-service
          predicates:
            - Path=/api/storages, /api/storages/**
          filters:
            - RewritePath=/api/storages(?<segment>/?.*), /storages${segment}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0