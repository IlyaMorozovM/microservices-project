server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: resource-processor

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-attempts: 4

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    prefer-ip-address: true

rabbitmq:
  exchange: ${RESOURCE_PROCESSING_EXCHANGE:resource.processing.exchange}
  queue: ${RESOURCE_PROCESSING_QUEUE:resource.processing.queue}
  routing-key: ${RESOURCE_PROCESSING_ROUTING_KEY:resource.processing.key}