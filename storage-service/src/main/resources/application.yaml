server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: storage-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/storage_service_db}
    username: ${SPRING_DATASOURCE_USERNAME:storage_user}
    password: ${SPRING_DATASOURCE_PASSWORD:storage_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health