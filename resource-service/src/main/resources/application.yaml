server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: resource-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/resource_service_db}
    username: ${SPRING_DATASOURCE_USERNAME:resource_user}
    password: ${SPRING_DATASOURCE_PASSWORD:resource_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
    prefer-ip-address: true

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:4566}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY:test}
  secret-key: ${S3_SECRET_KEY:test}

rabbitmq:
  exchange: ${RESOURCE_PROCESSING_EXCHANGE:resource.processing.exchange}
  queue: ${RESOURCE_PROCESSING_QUEUE:resource.processing.queue}
  routing-key: ${RESOURCE_PROCESSING_ROUTING_KEY:resource.processing.key}
  processed-exchange: ${RESOURCE_PROCESSED_EXCHANGE:resource.processed.exchange}
  processed-queue: ${RESOURCE_PROCESSED_QUEUE:resource.processed.queue}
  processed-routing-key: ${RESOURCE_PROCESSED_ROUTING_KEY:resource.processed.key}

resilience4j:
  circuitbreaker:
    instances:
      storageService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-closed-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0